[package]
name = "exact-sni-relay"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Bounded exact-SNI TLS passthrough relay for Linux"
readme = "README.md"
repository = "https://github.com/Serjik-Developer/exact-sni-relay"
homepage = "https://github.com/Serjik-Developer/exact-sni-relay"
documentation = "https://github.com/Serjik-Developer/exact-sni-relay#readme"
authors = ["Sergik <180444629+Serjik-Developer@users.noreply.github.com>"]
keywords = ["sni", "tls", "proxy", "nftables", "tokio"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
arc-swap = "1.7.1"
clap = { version = "4.5.32", features = ["derive"] }
libc = "0.2.171"
prometheus = "0.13.4"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.44.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26.2"

[dev-dependencies]
tempfile = "3.19.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
